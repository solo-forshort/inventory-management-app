{% extends 'inventory/base.html' %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} Category{% endblock %}
{% block content %}
<h1 class="mb-4">{% if object %}Edit{% else %}Add{% endif %} Category</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'category-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
