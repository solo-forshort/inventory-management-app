{% extends 'inventory/base.html' %}
{% block title %}Delete Product{% endblock %}
{% block content %}
<h1 class="mb-4">Delete Product</h1>
<p>Are you sure you want to delete <strong>{{ object.name }}</strong> ({{ object.sku }})? This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'product-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
